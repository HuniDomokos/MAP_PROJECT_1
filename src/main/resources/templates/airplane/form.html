<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New airplane')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>New airplane</h1>
    <form th:action="@{/airplanes}" method="post">
        <label>Number
            <input type="number" name="number" required min="1">
        </label>
        <label>Capacity
            <input type="number" name="capacity" required min="1">
        </label>
        <button type="submit">Create</button>
        <a th:href="@{/airplanes}">Cancel</a>
    </form>
</main>
</body>
</html>
