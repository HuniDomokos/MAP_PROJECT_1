<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Airplanes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Airplanes</h1>
    <p><a class="button" th:href="@{/airplanes/new}">New airplane</a></p>
    <table>
        <thead>
        <tr><th>ID</th><th>Number</th><th>Capacity</th><th>Flights</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="item : ${airplanes}">
            <td th:text="${item.id}">ID</td>
            <td th:text="${item.number}">Number</td>
            <td th:text="${item.capacity}">Capacity</td>
            <td th:text="${item.flights.size()}">Flights</td>
            <td>
                <form th:action="@{'/airplanes/' + ${item.id} + '/delete'}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(airplanes)}">
            <td colspan="5">Nothing here yet.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
