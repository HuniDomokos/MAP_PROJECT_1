<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New staff member')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>New staff member</h1>
    <form th:action="@{/staff}" method="post">
        <label>Type
            <select name="type">
                <option value="AIRLINE">Airline employee</option>
                <option value="AIRPORT">Airport employee</option>
            </select>
        </label>
        <label>Name
            <input type="text" name="name" required>
        </label>
        <label>Role (airline employee)
            <input type="text" name="role">
        </label>
        <label>Designation (airport employee)
            <input type="text" name="designation">
        </label>
        <label>Department (airport employee)
            <input type="text" name="department">
        </label>
        <button type="submit">Create</button>
        <a th:href="@{/staff}">Cancel</a>
    </form>
</main>
</body>
</html>
