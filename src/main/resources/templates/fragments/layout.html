<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Flight Management System</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; color: #1f2933; background: #f5f7fa; }
        nav { background: #1f3a5f; padding: 0.6rem 1rem; display: flex; flex-wrap: wrap; gap: 1rem; }
        nav a { color: #fff; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; }
        table { border-collapse: collapse; width: 100%; background: #fff; }
        th, td { border: 1px solid #d5dbe3; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.9rem; }
        th { background: #e8edf3; }
        form label { display: block; margin-bottom: 0.8rem; }
        form input, form select { display: block; margin-top: 0.2rem; padding: 0.35rem; min-width: 18rem; }
        td form { margin: 0; }
        button, a.button { padding: 0.4rem 0.9rem; border: 0; border-radius: 4px; background: #1f3a5f;
                           color: #fff; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
        td button { background: #b3261e; }
    </style>
</head>
<body>
<nav th:fragment="nav">
    <a th:href="@{/airplanes}">Airplanes</a>
    <a th:href="@{/flights}">Flights</a>
    <a th:href="@{/notice-boards}">Notice boards</a>
    <a th:href="@{/passengers}">Passengers</a>
    <a th:href="@{/tickets}">Tickets</a>
    <a th:href="@{/luggage}">Luggage</a>
    <a th:href="@{/staff}">Staff</a>
    <a th:href="@{/flight-assignments}">Flight assignments</a>
</nav>
</body>
</html>
