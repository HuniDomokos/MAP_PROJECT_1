<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Luggage')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
  <h2>Luggage</h2>
  <p><a class="button" th:href="@{/luggage/new}">Add Luggage</a></p>
  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Ticket ID</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="l : ${luggageList}">
      <td th:text="${l.id}">ID</td>
      <td th:text="${l.ticketId}">Ticket</td>
      <td th:text="${l.status}">Status</td>
      <td>
        <form th:action="@{'/luggage/' + ${l.id} + '/delete'}" method="post">
          <button type="submit">Delete</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</main>
</body>
</html>
