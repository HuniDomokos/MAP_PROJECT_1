<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Luggage')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Luggage</h1>
    <p><a class="button" th:href="@{/luggage/new}">New luggage</a></p>
    <table>
        <thead>
        <tr><th>ID</th><th>Ticket ID</th><th>Status</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="item : ${luggageList}">
            <td th:text="${item.id}">ID</td>
            <td th:text="${item.ticketId}">Ticket ID</td>
            <td th:text="${item.status}">Status</td>
            <td>
                <form th:action="@{'/luggage/' + ${item.id} + '/delete'}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(luggageList)}">
            <td colspan="4">Nothing here yet.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
