<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Passengers')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Passengers</h1>
    <p><a class="button" th:href="@{/passengers/new}">New passenger</a></p>
    <table>
        <thead>
        <tr><th>ID</th><th>Name</th><th>Currency</th><th>Email</th><th>Tickets</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="item : ${passengers}">
            <td th:text="${item.id}">ID</td>
            <td th:text="${item.name}">Name</td>
            <td th:text="${item.currency}">Currency</td>
            <td th:text="${item.email}">Email</td>
            <td th:text="${item.tickets.size()}">Tickets</td>
            <td>
                <form th:action="@{'/passengers/' + ${item.id} + '/delete'}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(passengers)}">
            <td colspan="6">Nothing here yet.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
