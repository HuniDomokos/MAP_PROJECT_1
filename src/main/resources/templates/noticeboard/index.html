<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notice boards')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Notice boards</h1>
    <p><a class="button" th:href="@{/notice-boards/new}">New notice board</a></p>
    <table>
        <thead>
        <tr><th>ID</th><th>Date</th><th>Flights of the day</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="item : ${noticeBoards}">
            <td th:text="${item.id}">ID</td>
            <td th:text="${item.date}">Date</td>
            <td th:text="${item.flightsOfTheDay.size()}">Flights of the day</td>
            <td>
                <form th:action="@{'/notice-boards/' + ${item.id} + '/delete'}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(noticeBoards)}">
            <td colspan="4">Nothing here yet.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
