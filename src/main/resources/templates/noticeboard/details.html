<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notice Board Details')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
  <h1>Notice Board Details</h1>
  <table>
    <tr><th>ID</th><td th:text="${noticeBoard.id}">ID</td></tr>
    <tr><th>Date</th><td th:text="${noticeBoard.date}">Date</td></tr>
  </table>

  <h2>Flights of the Day</h2>
  <table>
    <thead>
    <tr><th>Flight ID</th><th>Name</th><th>Airplane ID</th><th>Departure Time</th></tr>
    </thead>
    <tbody>
    <tr th:each="f : ${noticeBoard.flightsOfTheDay}">
      <td th:text="${f.id}">ID</td>
      <td th:text="${f.name}">Name</td>
      <td th:text="${f.airplaneId}">Airplane ID</td>
      <td th:text="${f.departureTime}">Departure</td>
    </tr>
    <tr th:if="${#lists.isEmpty(noticeBoard.flightsOfTheDay)}">
      <td colspan="4">No flights scheduled on this notice board.</td>
    </tr>
    </tbody>
  </table>

  <p style="margin-top: 1rem;">
    <a class="button" th:href="@{'/notice-boards/' + ${noticeBoard.id} + '/edit'}">Edit</a>
    <a th:href="@{/notice-boards}" style="margin-left: 0.5rem;">Back to list</a>
  </p>
</main>
</body>
</html>
