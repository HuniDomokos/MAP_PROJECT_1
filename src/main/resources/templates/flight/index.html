<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Flights')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h2>Flights</h2>
    <p><a class="button" th:href="@{/flights/new}">Add Flight</a></p>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Flight Name</th>
            <th>Departure Time</th>
            <th>Airplane ID</th>
            <th>Notice Board ID</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="f : ${flights}">
            <td th:text="${f.id}">ID</td>
            <td th:text="${f.name}">Name</td>
            <td th:text="${f.departureTime}">Time</td>
            <td th:text="${f.airplaneId}">Airplane</td>
            <td th:text="${f.noticeBoardId}">Notice Board</td>
            <td>
                <form th:action="@{'/flights/' + ${f.id} + '/delete'}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
