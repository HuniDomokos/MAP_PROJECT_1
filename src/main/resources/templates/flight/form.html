<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New flight')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>New flight</h1>
    <form th:action="@{/flights}" method="post">
        <label>Name
            <input type="text" name="name" required>
        </label>
        <label>Airplane
            <select name="airplaneId" required>
                <option th:each="o : ${airplanes}" th:value="${o.id}" th:text="${'No. ' + o.number + ' (capacity ' + o.capacity + ')'}">option</option>
            </select>
        </label>
        <label>Notice board
            <select name="noticeBoardId" required>
                <option th:each="o : ${noticeBoards}" th:value="${o.id}" th:text="${o.date}">option</option>
            </select>
        </label>
        <label>Departure time
            <input type="datetime-local" name="departureTime" required>
        </label>
        <button type="submit">Create</button>
        <a th:href="@{/flights}">Cancel</a>
    </form>
</main>
</body>
</html>
