<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New Ticket')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
  <h2>New Ticket</h2>
  <form th:action="@{/tickets}" method="post">
    <label>Passenger:
      <select name="passengerId" required>
        <option value="" disabled selected>Select passenger</option>
        <option th:each="p : ${passengers}" th:value="${p.id}" th:text="${p.name} + ' (' + ${p.email} + ')'"></option>
      </select>
    </label>
    <label>Flight:
      <select name="flightId" required>
        <option value="" disabled selected>Select flight</option>
        <option th:each="f : ${flights}" th:value="${f.id}" th:text="${f.name} + ' (' + ${f.departureTime} + ')'"></option>
      </select>
    </label>
    <label>Seat Number:
      <input type="text" name="seatNumber" placeholder="e.g. 12A" required>
    </label>
    <label>Price:
      <input type="number" step="0.01" name="price" required>
    </label>
    <button type="submit">Save</button>
  </form>
</main>
</body>
</html>
