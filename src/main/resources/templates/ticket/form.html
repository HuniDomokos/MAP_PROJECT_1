<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New ticket')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>New ticket</h1>
    <form th:action="@{/tickets}" method="post">
        <label>Passenger
            <select name="passengerId" required>
                <option th:each="o : ${passengers}" th:value="${o.id}" th:text="${o.name}">option</option>
            </select>
        </label>
        <label>Flight
            <select name="flightId" required>
                <option th:each="o : ${flights}" th:value="${o.id}" th:text="${o.name + ' (' + o.departureTime + ')'}">option</option>
            </select>
        </label>
        <label>Seat number
            <input type="text" name="seatNumber" required>
        </label>
        <label>Price
            <input type="number" name="price" required min="0" step="0.01">
        </label>
        <button type="submit">Create</button>
        <a th:href="@{/tickets}">Cancel</a>
    </form>
</main>
</body>
</html>
