<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tickets')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
  <h2>Tickets</h2>
  <p><a class="button" th:href="@{/tickets/new}">Add Ticket</a></p>
  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Passenger ID</th>
      <th>Flight ID</th>
      <th>Seat</th>
      <th>Price</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="t : ${tickets}">
      <td th:text="${t.id}">ID</td>
      <td th:text="${t.passengerId}">Passenger</td>
      <td th:text="${t.flightId}">Flight</td>
      <td th:text="${t.seatNumber}">Seat</td>
      <td th:text="${t.price}">Price</td>
      <td>
        <form th:action="@{'/tickets/' + ${t.id} + '/delete'}" method="post">
          <button type="submit">Delete</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</main>
</body>
</html>
