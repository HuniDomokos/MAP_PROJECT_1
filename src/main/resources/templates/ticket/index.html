<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tickets')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Tickets</h1>
    <p><a class="button" th:href="@{/tickets/new}">New ticket</a></p>
    <table>
        <thead>
        <tr><th>ID</th><th>Passenger ID</th><th>Flight ID</th><th>Seat</th><th>Price</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="item : ${tickets}">
            <td th:text="${item.id}">ID</td>
            <td th:text="${item.passengerId}">Passenger ID</td>
            <td th:text="${item.flightId}">Flight ID</td>
            <td th:text="${item.seatNumber}">Seat</td>
            <td th:text="${item.price}">Price</td>
            <td>
                <form th:action="@{'/tickets/' + ${item.id} + '/delete'}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tickets)}">
            <td colspan="6">Nothing here yet.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
