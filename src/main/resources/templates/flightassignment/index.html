<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Flight Assignments')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
  <h2>Flight Assignments</h2>
  <p><a class="button" th:href="@{/flight-assignments/new}">Add Assignment</a></p>
  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Flight ID</th>
      <th>Staff ID</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="fa : ${assignments}">
      <td th:text="${fa.id}">ID</td>
      <td th:text="${fa.flightId}">Flight</td>
      <td th:text="${fa.staffId}">Staff</td>
      <td>
        <form th:action="@{'/flight-assignments/' + ${fa.id} + '/delete'}" method="post">
          <button type="submit">Delete</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</main>
</body>
</html>
