<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Flight assignments')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Flight assignments</h1>
    <p><a class="button" th:href="@{/flight-assignments/new}">New flight assignment</a></p>
    <table>
        <thead>
        <tr><th>ID</th><th>Flight ID</th><th>Staff ID</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="item : ${assignments}">
            <td th:text="${item.id}">ID</td>
            <td th:text="${item.flightId}">Flight ID</td>
            <td th:text="${item.staffId}">Staff ID</td>
            <td>
                <form th:action="@{'/flight-assignments/' + ${item.id} + '/delete'}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(assignments)}">
            <td colspan="4">Nothing here yet.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
