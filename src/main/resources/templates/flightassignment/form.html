<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New flight assignment')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>New flight assignment</h1>
    <form th:action="@{/flight-assignments}" method="post">
        <label>Flight
            <select name="flightId" required>
                <option th:each="o : ${flights}" th:value="${o.id}" th:text="${o.name + ' (' + o.departureTime + ')'}">option</option>
            </select>
        </label>
        <label>Staff member
            <select name="staffId" required>
                <option th:each="o : ${staffMembers}" th:value="${o.id}" th:text="${o.name}">option</option>
            </select>
        </label>
        <button type="submit">Create</button>
        <a th:href="@{/flight-assignments}">Cancel</a>
    </form>
</main>
</body>
</html>
